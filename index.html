<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportsHub</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="assets/js/script.js"></script>
  </head>

  <body>
    <!-- RICERCA SQUADRE HEADER -->

    <header class="text-white text-center py-4">
      <div class="container">
        <h1 class="fw-bold mb-3">SportsHub</h1>

        <p class="mb-4">
          Cerca una squadra, scopri prossime partite e ultimi risultati.
        </p>

        <form id="searchForm">
          <div class="row justify-content-center">
            <div class="col-10 col-md-8 col-lg-6">
              <div class="input-group">
                <input
                  type="text"
                  id="searchInput"
                  class="form-control shadow-none"
                  placeholder="Inserisci il nome di una squadra"
                  aria-label="Nome squadra"
                />

                <button
                  id="searchButton"
                  class="btn btn-light fw-bold text-primary px-4"
                  type="submit"
                >
                  Cerca
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </header>

    <main class="bg-light min-vh-100 py-4">
      <div class="container">
        <!-- PREFERITI -->
        <section class="mb-4">
          <h2 class="fs-4 fw-bold mb-3">⭐ Le tue squadre preferite</h2>

          <div
            id="favorites"
            class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3"
          ></div>

          <p id="emptyFavorites" class="text-secondary fst-italic mt-2">
            Non hai ancora salvato nessuna squadra. Cercane una qui sopra e
            aggiungila ai preferiti.
          </p>
        </section>

        <!-- RISULTATO RICERCA -->
        <section>
          <h2 class="fs-4 fw-bold mb-3">Squadre trovate</h2>

          <div id="searchFeedback" class="mb-3"></div>

          <div
            id="results"
            class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3"
          ></div>

          <p id="emptyResults" class="text-secondary fst-italic mt-2">
            Inizia cercando una squadra qui sopra.
          </p>
        </section>

        <!-- DETTAGLI SQUADRA -->
        <div id="teamDetails" class="mt-4 d-none"></div>
      </div>
    </main>
  </body>
</html>
